[pytest]
testpaths = tests
pythonpath = . src
addopts = -ra
markers =
    blackbox: тесты «чёрного ящика» (граничные значения, предположение об ошибке)
    whitebox: тесты «белого ящика» (покрытие решений и условий)
    integration: интеграционные сценарии
    regression: регрессионные тесты (по найденным дефектам)