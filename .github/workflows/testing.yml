name: Testing

on:
  push:
    branches: [main, develop]
    paths: ["src/**", "tests/**", "tools/**", "pytest.ini", ".coveragerc", "requirements-dev.txt"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  tests:
    name: Тесты и покрытие (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Линтинг (flake8)
        run: flake8 src tests tools

      - name: Тесты и контроль покрытия (не менее 80 %)
        run: |
          pytest -v --cov=src --cov-branch --cov-report=term-missing \
                 --cov-report=xml --cov-fail-under=80

      - name: Сохранить отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  regression:
    name: Регрессионные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -r requirements-dev.txt
      - name: Регрессионный набор (дефекты BUG-1 … BUG-9)
        run: pytest -m regression -v
